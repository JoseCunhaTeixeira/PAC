[project]
name = "PAC"
version = "2.0.0"
requires-python = ">=3.14,<3.15"
license = "CC-BY-4.0"
authors = [
    { name = "J. Cunha Teixeira", email = "jose.cunha-teixeira@protonmail.com" },
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "obspy",
    "pydantic",
    "pyyaml",
    "fastapi[standard]",
    "sigpipe[silex,santiludo] @ git+https://github.com/JoseCunhaTeixeira/sigpipe",
    "disba>=0.7.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "pyright>=1.1", "pre-commit>=4"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]


# -------------------------
# Pyright configuration
# -------------------------
[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"

include = ["src"]

exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "**/node_modules",
    "**/.*",
]

reportMissingTypeStubs = false


# -------------------------
# Ruff configuration
# -------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RET", # flake8-return
    "PTH", # pathlib usage
    "NPY", # NumPy rules
    "RUF", # Ruff-specific rules
    "ANN", # annotations
    "ARG", # unused arguments
    "ERA", # commented-out code
]

ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["sigpipe"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true


# -------------------------
# Pytest configuration
# -------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
