# PAC: the API and the web app, at http://localhost:5173, with its assistant (PACo, PAC's agent,
# in the backend), whose model is set in its settings popup: a provider's API, or a server.
#
#   docker compose up -d --build
#
# PAC on a server, opened from other computers: set PAC_API_URL (e.g. http://server:8000) and
# PAC_WEB_URL (http://server:5173) in .env, the addresses the browsers use.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: ${PAC_WEB_URL:-http://localhost:5173}
      # The mode the chat runs (autonomous or workflow) and its model, from .env (the settings
      # popup wins over them): a provider's API, which needs no address, or a server's address.
      PACO_AGENT_MODE: ${PACO_AGENT_MODE:-}
      PACO_LLM_PROVIDER: ${PACO_LLM_PROVIDER:-}
      PACO_LLM_BASE_URL: ${PACO_LLM_BASE_URL:-}
      PACO_LLM_MODEL: ${PACO_LLM_MODEL:-}
      PACO_LLM_API_KEY: ${PACO_LLM_API_KEY:-}
      PACO_LLM_CONTEXT: ${PACO_LLM_CONTEXT:-}
      PACO_LLM_VISION: ${PACO_LLM_VISION:-}
      # Worker processes of the assistant's runs.
      PACO_WORKERS: ${PACO_WORKERS:-4}
      # Where the assistant's settings popup keeps its settings (the mode, the model, its key),
      # applied over these.
      PAC_SETTINGS_DIR: /app/data/settings
    volumes:
      - ./data/input:/app/data/input
      - ./data/output:/app/data/output
      - ./data/settings:/app/data/settings
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PAC_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
